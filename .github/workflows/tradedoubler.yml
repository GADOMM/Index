name: Perfumetr catalog feeds

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/tradedoubler.yml
      - config/**
      - scripts/**
      - tests/**
      - package.json
      - README.md
      - AGENTS.md
      - PROJECT_STATE.md
      - docs/**
  push:
    branches:
      - master
    paths:
      - .github/workflows/tradedoubler.yml
      - config/**
      - scripts/**
      - tests/**
      - package.json
      - README.md
  workflow_dispatch:
    inputs:
      mode:
        description: Tryb uruchomienia
        required: true
        default: proof
        type: choice
        options:
          - proof
          - full
          - partners
          - all
  schedule:
    - cron: "47 2 * * *"
    - cron: "47 8 * * *"
    - cron: "17 14 * * *"
    - cron: "47 20 * * *"

permissions:
  contents: read

concurrency:
  group: perfumetr-catalog-import
  cancel-in-progress: false

jobs:
  validate:
    name: Validate importer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out importer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate importer
        run: npm test

  import:
    name: Import all configured catalog sources
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      statuses: write
    steps:
      - name: Mark the first live import as pending
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=pending -f context=perfumetr/importer
          -f description="Test i pierwszy import są uruchomione"
          -f target_url="$RUN_URL"

      - name: Check out importer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Test all TradeDoubler sources after an importer change
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'proof' || inputs.mode == 'all'))
        env:
          PERFUMETR_ORIGIN: https://perfumetr.borodzicz85.chatgpt.site
          PERFUMETR_MODE: proof
        run: node scripts/tradedoubler-import.mjs

      - name: Run the full TradeDoubler import
        if: always() && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '17 14 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'all')))
        env:
          PERFUMETR_ORIGIN: https://perfumetr.borodzicz85.chatgpt.site
          PERFUMETR_MODE: full
        run: node scripts/tradedoubler-import.mjs

      - name: Advance partner sources through the shared orchestrator
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'partners' || inputs.mode == 'all')))
        env:
          PERFUMETR_ORIGIN: https://perfumetr.borodzicz85.chatgpt.site
          PERFUMETR_ORCHESTRATOR_STEPS: 48
        run: node scripts/catalog-orchestrator.mjs

      - name: Publish the first live import result
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RESULT_DESCRIPTION: ${{ job.status == 'success' && 'Test i pierwszy import zakończone' || 'Test lub import zakończony błędem' }}
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state="$RESULT_STATE" -f context=perfumetr/importer
          -f description="$RESULT_DESCRIPTION" -f target_url="$RUN_URL"
