name: Perfumetr Flaconi feed

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/flaconi.yml
      - scripts/catalog-orchestrator.mjs
      - tests/orchestrator.test.mjs
  push:
    branches:
      - master
    paths:
      - .github/workflows/flaconi.yml
      - scripts/catalog-orchestrator.mjs
      - tests/orchestrator.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perfumetr-catalog-import
  cancel-in-progress: false

jobs:
  validate:
    name: Validate importer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out importer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate importer
        run: npm test

  import:
    name: Advance only the Flaconi AWIN feed
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out importer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Advance the official Flaconi feed
        env:
          PERFUMETR_ORIGIN: https://perfumetr.borodzicz85.chatgpt.site
          PERFUMETR_ORCHESTRATOR_STEPS: 48
        run: node scripts/catalog-orchestrator.mjs awin:flaconi
